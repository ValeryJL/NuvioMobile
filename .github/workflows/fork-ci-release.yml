name: Fork CI & APK Prerelease

on:
  push:
    branches: [feat/torrent-offline-downloads]
  workflow_dispatch:
    inputs:
      supabase_url:
        description: Optional NUVIO_SUPABASE_URL override
        required: false
        type: string
      supabase_anon_key:
        description: Optional NUVIO_SUPABASE_ANON_KEY override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fork-ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Tests (full & playstore) + Full Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
          INPUT_SUPABASE_URL: ${{ inputs.supabase_url }}
          INPUT_SUPABASE_ANON_KEY: ${{ inputs.supabase_anon_key }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
          if [ -n "$INPUT_SUPABASE_URL" ]; then
            sed -i -E '/^[[:space:]]*(NUVIO_SUPABASE_URL|NUVIO_SUPABASE_FALLBACK_URL)[[:space:]]*=/d' local.properties
            printf '\nNUVIO_SUPABASE_URL=%s\nNUVIO_SUPABASE_FALLBACK_URL=\n' "$INPUT_SUPABASE_URL" >> local.properties
          fi
          if [ -n "$INPUT_SUPABASE_ANON_KEY" ]; then
            sed -i -E '/^[[:space:]]*NUVIO_SUPABASE_ANON_KEY[[:space:]]*=/d' local.properties
            printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$INPUT_SUPABASE_ANON_KEY" >> local.properties
          fi

      - name: Run playstore unit tests & verify playstore compilation
        run: |
          ./gradlew :composeApp:testAndroidHostTest :androidApp:compilePlaystoreDebugKotlin \
            -Pnuvio.android.distribution=playstore \
            -Pnuvio.ios.distribution=appstore \
            -Dorg.gradle.jvmargs="-Xmx6144M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m" \
            -Dkotlin.daemon.jvmargs="-Xmx3072M" \
            --stacktrace

      - name: Run full distribution unit tests
        run: |
          ./gradlew :composeApp:testAndroidHostTest \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -Dorg.gradle.jvmargs="-Xmx6144M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m" \
            -Dkotlin.daemon.jvmargs="-Xmx3072M" \
            --stacktrace

      - name: Build installable fullDebug APK
        run: |
          ./gradlew :androidApp:assembleFullDebug \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -Dorg.gradle.jvmargs="-Xmx6144M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m" \
            -Dkotlin.daemon.jvmargs="-Xmx3072M" \
            --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: composeApp/build/reports/tests/
          retention-days: 5

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-full-debug-apk
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Verify iOS Kotlin Compilation (appstore & full)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
          INPUT_SUPABASE_URL: ${{ inputs.supabase_url }}
          INPUT_SUPABASE_ANON_KEY: ${{ inputs.supabase_anon_key }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
          if [ -n "$INPUT_SUPABASE_URL" ]; then
            sed -i '' -E '/^[[:space:]]*(NUVIO_SUPABASE_URL|NUVIO_SUPABASE_FALLBACK_URL)[[:space:]]*=/d' local.properties
            printf '\nNUVIO_SUPABASE_URL=%s\nNUVIO_SUPABASE_FALLBACK_URL=\n' "$INPUT_SUPABASE_URL" >> local.properties
          fi
          if [ -n "$INPUT_SUPABASE_ANON_KEY" ]; then
            sed -i '' -E '/^[[:space:]]*NUVIO_SUPABASE_ANON_KEY[[:space:]]*=/d' local.properties
            printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$INPUT_SUPABASE_ANON_KEY" >> local.properties
          fi

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Compile iOS (appstore)
        run: |
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 \
            -Pnuvio.android.distribution=playstore \
            -Pnuvio.ios.distribution=appstore \
            -Dorg.gradle.jvmargs="-Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M" \
            -Dkotlin.daemon.jvmargs="-Xmx2048M" \
            -Dkotlin.native.jvmArgs="-Xmx4608M" \
            --stacktrace

      - name: Compile iOS (full)
        run: |
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=full \
            -Dorg.gradle.jvmargs="-Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M" \
            -Dkotlin.daemon.jvmargs="-Xmx2048M" \
            -Dkotlin.native.jvmArgs="-Xmx4608M" \
            --stacktrace

  release:
    name: Create Fork Prerelease with APK
    if: github.repository == 'ValeryJL/NuvioMobile'
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download fullDebug APK
        uses: actions/download-artifact@v7
        with:
          name: nuvio-full-debug-apk
          path: dist

      - name: Publish prerelease on fork
        env:
          SHA_SHORT: ${{ github.sha }}
        run: |
          apk_path="dist/androidApp-full-debug.apk"
          if [[ ! -f "${apk_path}" ]]; then
            echo "Compiled APK not found at ${apk_path}" >&2
            exit 1
          fi
          tag="torrent-downloads-r${{ github.run_number }}"
          sha_short="$(printf '%s' "${SHA_SHORT}" | cut -c1-8)"
          title="Torrent Offline Downloads Preview (#${{ github.run_number }} - ${sha_short})"
          cat <<'EOF' > release-notes.md
          ### Qué incluye
          - Descarga offline de streams torrent/magnet con `nuvio-engine` en Android (`full` flavor).
          - Soporte para pausar, reanudar (`Range`), cancelar y eliminar sin duplicar caché ni archivos parciales.
          - Soporte para torrents multi-archivo (`fileIdx`), extracción de trackers `&tr=` / Base32 y descarga de subtítulos externos.
          - Verificación automática: unit tests `playstore` y `full` (`:composeApp:testAndroidHostTest`), compilación `playstore`, compilación iOS (`appstore` y `full`) y armado de APK `fullDebug`.

          > [!NOTE]
          > Este APK (`com.nuviodebug.com`) está firmado con clave debug y puede instalarse en tu celular junto a la versión estable sin desinstalarla.
          EOF
          printf '\nBuild de prueba generado desde la rama `%s` (`%s`).\n' "${GITHUB_REF_NAME}" "${sha_short}" >> release-notes.md
          gh release create "${tag}" "${apk_path}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${title}" \
            --notes-file release-notes.md \
            --prerelease
